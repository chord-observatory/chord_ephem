# Save as .pre-commit-config.yaml in the repository, then run `pre-commit install`
# once per clone. See https://pre-commit.com
repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.0
  hooks:
    - id: ruff-check
      args: [--fix]
      types_or: [python, pyi]
    - id: ruff-format
      types_or: [python, pyi]
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
    - id: check-yaml
    - id: check-added-large-files
      args: [--maxkb=1000]
    - id: end-of-file-fixer
    - id: trailing-whitespace
- repo: https://github.com/kynan/nbstripout
  rev: 0.8.1
  hooks:
    - id: nbstripout
