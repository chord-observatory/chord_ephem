[build-system]
requires = ["setuptools>=61.0.0", "wheel", "setuptools-git-versioning"]
build-backend = "setuptools.build_meta"

[project]
name = "chord_ephem"
authors = [
  {name = "The CHORD Collaboration"}
]
description = "CHORD ephemeris: observers, time conversions and source catalogues"
requires-python = ">=3.10"
dynamic = ["readme", "version"]
license = {file = "LICENSE"}
dependencies = [
    "caput @ git+https://github.com/radiocosmology/caput.git",
    "fluxcat @ git+https://github.com/radiocosmology/fluxcat.git",
    "numpy",
    "pyyaml",
    "skyfield >= 1.10",
    "tzdata",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-mpi",
]
docs = [
    "numpydoc",
    "Sphinx",
    "sphinx_rtd_theme",
]

[tool.setuptools]
packages = ["chord_ephem"]

[tool.setuptools.package-data]
"chord_ephem" = ["*.yaml"]

[tool.setuptools.dynamic]
readme = {file = ["README.md"], content-type = "text/markdown"}

[tool.setuptools-git-versioning]
enabled = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
# Same rules as CHIME's ch_pipeline: pycodestyle, pydocstyle, pyflakes, isort,
# pyupgrade, numpy, ruff, blind-except, comprehensions, returns
lint.select = ["E", "D", "F", "I", "UP", "NPY", "RUF", "BLE", "C4", "RET"]
lint.ignore = [
    "E501",  # line length is handled by the formatter
    "D105",  # docstrings for magic methods
    "D107",  # docstrings for __init__ (document the class instead)
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
